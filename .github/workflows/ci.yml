name: CI

on:
  push:
  pull_request:

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Shared spec + store tests (Swift)
        working-directory: ios/AtlasCore
        run: swift test
      - name: Build app for iOS Simulator
        working-directory: ios
        run: >
          xcodebuild -project Atlas.xcodeproj -scheme Atlas
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared spec + store tests (Kotlin) and debug APK
        working-directory: android
        run: ./gradlew :core:test :app:assembleDebug
